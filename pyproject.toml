[project]
name = "cerrrbot"
version = "1.0.0"
requires-python = ">=3.14.7"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.3",
    "dishka>=1.1.0",
    "apscheduler>=3.11.3",
    "celery>=5.6.3",
    "click>=8.4.2",
    "dishka>=1.10.1",
    "httpx>=0.28.1",
    "orjson>=3.11.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "redis>=8.0.1",
    "loguru>=0.7.2",
]

[tool.uv.workspace]
members = ["app/plugins"]

[tool.uv.sources]
cerrrbot-plugins = { workspace = true }

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-redis>=4.6.0.20241004"
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 90
target-version = ['py38']
