name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy to VPS after build'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Custom tag (defaults to latest if blank)'
        required: false
        type: string
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.event.inputs.tag_name == 'latest' }}
            type=raw,value=${{ github.event.inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: ${{ github.ref_type == 'tag' || github.event.inputs.deploy_to_vps == true || github.event.inputs.deploy_to_vps == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Determine Target Image Tag
        id: target
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="latest"
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TARGET_TAG,REGISTRY,IMAGE_NAME
          script: |
            set -e
            cd /opt/cerrrbot

            echo "=========================================="
            echo " Deploying cerrrbot ($TARGET_TAG)..."
            echo "=========================================="

            # Fetch git updates and recursive submodules if git is present
            if [ -d .git ]; then
              echo "==> Fetching git updates and submodules..."
              git fetch --tags --recurse-submodules=yes
              if git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
                git checkout "$TARGET_TAG"
              else
                git checkout main || true
                git pull || true
              fi
              git submodule sync --recursive
              git submodule update --init --recursive
            fi

            FULL_IMAGE="$REGISTRY/$IMAGE_NAME:$TARGET_TAG"
            echo "==> Deploying image: $FULL_IMAGE using Makefile..."
            APP_IMAGE_NAME="$FULL_IMAGE" make deploy

            echo "=========================================="
            echo " Deployment completed successfully!"
            echo "=========================================="
